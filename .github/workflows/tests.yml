    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  tests:
    uses: grovegs/workflows/.github/workflows/package-tests.yml@v1.2.1
    with:
      dotnet-project: tests/GroveGames.DependencyInjection.Tests
      global-json-file: global.json
