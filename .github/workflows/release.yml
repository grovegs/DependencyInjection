name: 🚀 Release

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      version-type:
        description: Select the version to increment, or auto to read it from the commits
        required: true
        default: auto
        type: choice
        options:
          - auto
          - major
          - minor
          - patch
      environment:
        description: Development publishes a -dev version to GitHub Packages, Production publishes to nuget.org and GitHub Releases. Scheduled runs release Development when src changed.
        required: true
        default: Development
        type: choice
        options:
          - Development
          - Production

permissions:
  contents: write
  actions: read
  packages: write

jobs:
  release:
    name: Release Package
    uses: grovegs/workflows/.github/workflows/package-release.yml@v1.5.0
    with:
      package-name: Dependency Injection
      version-type: ${{ inputs.version-type || 'auto' }}
      version-suffix: ${{ inputs.environment != 'Production' && 'dev' || '' }}
      runs-on: ubuntu-latest
      dotnet-project: src/GroveGames.DependencyInjection
      global-json-file: global.json
      directory-build-props: Directory.Build.props
      readme-file: README.md
      license-file: LICENSE
      godot-addon: src/GroveGames.DependencyInjection.Godot/addons/GroveGames.DependencyInjection
      unity-package: src/GroveGames.DependencyInjection.Unity/Packages/com.grovegames.dependencyinjection
      create-tag: true
      publish-github: ${{ inputs.environment == 'Production' }}
      publish-nuget: ${{ inputs.environment == 'Production' }}
      publish-github-packages: ${{ inputs.environment != 'Production' }}
      publish-discord: true
      skip-unchanged: ${{ github.event_name == 'schedule' }}
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}
      client-id: ${{ secrets.CLIENT_ID }}
      app-private-key: ${{ secrets.APP_PRIVATE_KEY }}
      nuget-api-key: ${{ secrets.NUGET_API_KEY }}
      discord-webhook: ${{ secrets.DISCORD_WEBHOOK }}
